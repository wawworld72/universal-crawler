name: Universal Web Crawler (with History)
on:
  workflow_dispatch:
    inputs:
      url:
        description: '크롤링할 URL (필수)'
        required: true
        type: string
        default: 'https://example.com'
      selector:
        description: 'CSS 선택자 (선택)'
        required: false
        type: string
        default: ''
      filename:
        description: '저장할 파일명 (선택, 비우면 자동생성)'
        required: false
        type: string
        default: ''
jobs:
  crawl-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      - name: Crawl and Save to GitHub History
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
          SELECTOR: ${{ github.event.inputs.selector }}
          FILENAME: ${{ github.event.inputs.filename }}
        run: |
          python << 'PYEOF'
          import os, re, json, requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          from urllib.parse import urlparse
          url = os.environ['TARGET_URL']
          selector = os.environ.get('SELECTOR', '').strip()
          filename_input = os.environ.get('FILENAME', '').strip()
          print(f"Crawling: {url}")
          headers = {'User-Agent': 'Mozilla/5.0'}
          resp = requests.get(url, headers=headers, timeout=30)
          resp.raise_for_status()
          soup = BeautifulSoup(resp.text, 'lxml')
          if selector:
              elements = soup.select(selector)
              data = [{'text': el.get_text(strip=True), 'html': str(el)[:2000]} for el in elements[:50]]
          else:
              data = {'title': soup.title.string if soup.title else '', 'text': soup.get_text(' ', strip=True)[:15000]}
          if filename_input:
              filename = filename_input
          else:
              domain = urlparse(url).netloc.replace('.', '_')
              timestamp = datetime.now().strftime('%Y%m%d_%H%M%S')
              filename = f"{domain}_{timestamp}"
          if not filename.endswith('.json') and not filename.endswith('.md'):
              filename = filename + '.json'
          result = {
              'url': url,
              'selector': selector,
              'timestamp': datetime.now().isoformat(),
              'domain': urlparse(url).netloc,
              'data': data,
              'html_length': len(resp.text)
          }
          os.makedirs('data', exist_ok=True)
          with open(f'data/{filename}', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          with open('data/latest.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          md_filename = filename.replace('.json', '.md')
          with open(f'data/{md_filename}', 'w', encoding='utf-8') as f:
              f.write(f"# Crawl Result\n\n- **URL:** {url}\n- **Time:** {result['timestamp']}\n- **Selector:** {selector or 'full page'}\n\n## Data\n\n```json\n{json.dumps(data, ensure_ascii=False, indent=2)[:8000]}\n```\n")
          index_path = 'data/index.md'
          history_line = f"| {datetime.now().strftime('%Y-%m-%d %H:%M:%S')} | {url} | {selector or 'full'} | [{filename}]({filename}) |"
          if not os.path.exists(index_path):
              with open(index_path, 'w', encoding='utf-8') as f:
                  f.write("# Crawl History\n\n| Time | URL | Selector | File |\n|------|-----|----------|------|\n")
          with open(index_path, 'r', encoding='utf-8') as f:
              content = f.read()
          with open(index_path, 'w', encoding='utf-8') as f:
              lines = content.split('\n')
              lines.insert(3, history_line)
              f.write('\n'.join(lines))
          print(f"Saved to data/{filename}")
          PYEOF
      - name: Commit results to GitHub history
        run: |
          git config --local user.email "crawler@github.com"
          git config --local user.name "Universal Crawler Bot"
          git add data/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Crawl: ${{ github.event.inputs.url }} - $(date '+%Y-%m-%d %H:%M:%S')"
          git push
