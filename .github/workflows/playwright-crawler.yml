name: Playwright Advanced Crawler

on:
  workflow_dispatch:
    inputs:
      url:
        description: '크롤링할 URL'
        required: true
        type: string
        default: 'https://example.com'
      actions_json:
        description: '행동 JSON (예: [{"click": ".btn"}, {"extract": ".title"}])'
        required: false
        type: string
        default: '[{"extract": "h1"}]'
      mode:
        description: '모드'
        required: false
        type: choice
        options:
          - auto
          - youtube
          - login
          - shop
        default: 'auto'

jobs:
  playwright-crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright beautifulsoup4 requests youtube-transcript-api
          playwright install chromium
          playwright install-deps
      - name: Run Playwright Crawler
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
          ACTIONS_JSON: ${{ github.event.inputs.actions_json }}
        run: |
          python << 'PYEOF'
          import os, json, asyncio
          from playwright.async_api import async_playwright

          url = os.environ.get('TARGET_URL')
          actions_str = os.environ.get('ACTIONS_JSON', '[{"extract": "h1"}]')
          
          try:
              actions = json.loads(actions_str)
          except:
              actions = [{"extract": actions_str}]

          async def run():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page(user_agent='Mozilla/5.0')
                  await page.goto(url, wait_until='networkidle', timeout=60000)
                  
                  results = []
                  for action in actions:
                      if 'click' in action:
                          print(f"Clicking: {action['click']}")
                          await page.click(action['click'], timeout=10000)
                          await page.wait_for_timeout(1000)
                      elif 'fill' in action:
                          selector, value = action['fill']
                          print(f"Filling: {selector}")
                          await page.fill(selector, value)
                      elif 'wait' in action:
                          await page.wait_for_selector(action['wait'], timeout=10000)
                      elif 'extract' in action:
                          selector = action['extract']
                          els = await page.locator(selector).all_text_contents()
                          results.append({'selector': selector, 'data': els})
                          print(f"Extracted {len(els)} from {selector}")
                      elif 'scroll' in action:
                          await page.mouse.wheel(0, action['scroll'])
                          await page.wait_for_timeout(1000)
                  
                  # Save results
                  with open('playwright_result.json', 'w', encoding='utf-8') as f:
                      json.dump({'url': url, 'actions': actions, 'results': results}, f, ensure_ascii=False, indent=2)
                  
                  await browser.close()

          asyncio.run(run())
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: playwright_result.json

  youtube-qt-auto:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.mode == 'youtube' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install youtube-transcript-api requests beautifulsoup4
      - run: |
          python << 'PYEOF'
          import requests, re
          from youtube_transcript_api import YouTubeTranscriptApi
          # Get latest video from channel
          channel_url = "https://www.youtube.com/@nalmada-gimakhin"
          # For demo, use latest known video
          video_id = "RGYoYi56G_8"
          try:
              transcript = YouTubeTranscriptApi.get_transcript(video_id, languages=['ko','en'])
              text = ' '.join([t['text'] for t in transcript])
              with open('latest_qt_transcript.txt','w',encoding='utf-8') as f:
                  f.write(text)
              print(f"Transcript length: {len(text)}")
          except Exception as e:
              print(f"Error: {e}")
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-transcript
          path: latest_qt_transcript.txt
