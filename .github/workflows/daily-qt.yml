
name: Daily QT Automation

on:
  schedule:
    - cron: '0 22 * * *' # KST 07:00
  workflow_dispatch:

jobs:
  daily-qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install youtube-transcript-api requests
      - name: Fetch latest QT
        run: |
          python scripts/daily_qt.py
      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A || true
          git commit -m "Daily QT $(date +%Y-%m-%d)" || true
          git push || true
